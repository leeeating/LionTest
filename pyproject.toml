[project]
name = "liontest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "delta-spark>=4.4.1",
    "duckdb>=1.5.6",
    "pandas<3",
    "pyspark>=4.2.0",
    "pytest>=9.1.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["LionDEExam/submission/part_a"]
testpaths = ["LionDEExam/submission/part_a/tests"]
# 開發中只跑快的：pytest -m "not slow"；全套與 TZ=UTC 交付前各跑一次
markers = ["slow: 會寫 Delta 表或跑真實資料完整流程的測試"]
